apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules.yml

    remote_write:
      - url: "https://prometheus-prod-40-prod-sa-east-1.grafana.net/api/prom/push"
        basic_auth:
          username: "<GRAFANA_CLOUD_USER_ID>"
          password: "<GRAFANA_CLOUD_API_KEY>"
        queue_config:
          max_samples_per_send: 500
          max_shards: 2
          capacity: 2500

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter.monitoring.svc:9100']

      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: 'blackcat-backend'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets: ['backend.blackcat.svc:8080']

      - job_name: 'mysqld-exporter'
        metrics_path: '/metrics'
        scrape_interval: 10s
        static_configs:
          - targets: ['mysqld-exporter.blackcat.svc:9104']

  rules.yml: |
    groups:
      - name: finops_k8s_requests
        rules:
          - record: kube_pod_container_resource_requests
            expr: vector(536870912)
            labels:
              resource: memory
              namespace: blackcat
              container: backend
          - record: kube_pod_container_resource_requests
            expr: vector(402653184)
            labels:
              resource: memory
              namespace: blackcat
              container: mysql
          - record: kube_pod_container_resource_requests
            expr: vector(134217728)
            labels:
              resource: memory
              namespace: blackcat
              container: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=4h"
            - "--web.enable-lifecycle"
            - "--web.enable-admin-api"
            - "--web.enable-remote-write-receiver"
          ports:
            - containerPort: 9090
              name: web
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30090
  type: NodePort
