apiVersion: v1
kind: Secret
metadata:
  name: mysqld-exporter-config
  namespace: blackcat
type: Opaque
stringData:
  .my.cnf: |
    [client]
    user=exporter
    password=<MYSQL_EXPORTER_PASSWORD>
    host=mysql.blackcat.svc
    port=3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysqld-exporter
  namespace: blackcat
  labels:
    app: mysqld-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysqld-exporter
  template:
    metadata:
      labels:
        app: mysqld-exporter
    spec:
      containers:
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.15.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.my-cnf=/etc/my.cnf/.my.cnf"
            - "--collect.global_status"
            - "--collect.global_variables"
            - "--collect.info_schema.processlist"
          ports:
            - containerPort: 9104
              name: metrics
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/my.cnf
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: mysqld-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: mysqld-exporter
  namespace: blackcat
  labels:
    app: mysqld-exporter
spec:
  selector:
    app: mysqld-exporter
  ports:
    - name: metrics
      port: 9104
      targetPort: 9104
