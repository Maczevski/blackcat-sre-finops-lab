spring.application.name=BlackCat

# Configuração JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Conexão com Banco de Dados MySQL (Credenciais injetadas via Secret no K3s)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blackcat}
spring.datasource.username=${DB_USER:blackcat}
spring.datasource.password=${DB_PASSWORD:<DB_PASSWORD>}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Liquibase Migrations (001-initial-schema, 002-insert-initial-user, 003-seed-products)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# Exposição de Métricas SRE (Spring Boot Actuator & Prometheus)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
