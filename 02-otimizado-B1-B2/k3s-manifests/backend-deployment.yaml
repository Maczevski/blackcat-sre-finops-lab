# ==============================================================================
# MANIFESTO KUBERNETES (K3s) — TRATAMENTO OTIMIZADO SRE & FINOPS (CENÁRIOS B1 E B2)
# - Cenário B1 (Otimização SRE): Aplicado sobre instância AWS EC2 t3.medium (2 vCPU, 4 GiB RAM - US$ 0,0416/h)
# - Cenário B2 (Right-Sizing FinOps): Aplicado sobre instância AWS EC2 t3.small (2 vCPU, 2 GiB RAM - US$ 0,0208/h)
# - Imagem ECR: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-2.amazonaws.com/blackcat-backend:tcc-v5-cenario-B
# - JVM Runtime: JAVA_TOOL_OPTIONS="-XX:+UseG1GC -Xms384m -Xmx384m" e cota de CPU expandida para 1500m
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: blackcat
  labels:
    app: backend
    experiment.tcc/treatment: optimized-v5
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: backend
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-2.amazonaws.com/blackcat-backend:tcc-v5-cenario-B
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:+UseG1GC -Xms384m -Xmx384m"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: SPRING_LIQUIBASE_PARAMETERS_INITIAL_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: INITIAL_ADMIN_PASSWORD_HASH
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "384Mi"
              cpu: "500m"
            limits:
              memory: "768Mi"
              cpu: "1500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3
